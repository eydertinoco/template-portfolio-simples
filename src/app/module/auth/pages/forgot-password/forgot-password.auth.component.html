<auth-form title="{{'AUTH.FORGOT-PASSWORD.TITLE' | translate}}"
           description="{{'AUTH.FORGOT-PASSWORD.DESCRIPTION' | translate}}">
  <form>
    <auth-input id="email" label="{{'AUTH.FORGOT-PASSWORD.EMAIL' | translate}}" type="email" name="email"/>

    <auth-button value="{{'AUTH.FORGOT-PASSWORD.BUTTON' | translate}}"/>

    <auth-link value="{{'AUTH.FORGOT-PASSWORD.REGISTER' | translate}}" link="/auth/register"/>
  </form>
</auth-form>
